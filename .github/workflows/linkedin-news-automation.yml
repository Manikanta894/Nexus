name: LinkedIn Engagement + News Radar Auto-Post

on:
  schedule:
    - cron: '0 */2 * * *'   # Every 2 hours

jobs:
  linkedin-engage:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-Find LinkedIn Posts + Draft Comments
        run: |
          APP="${{ secrets.APP_URL }}"
          TOKEN="${{ secrets.NEXUS_API_TOKEN }}"
          for TOPIC in "AI" "Leadership" "HR" "Business Analytics" "MBA" "Productivity"; do
            echo "🔍 Finding posts about: $TOPIC"
            curl -s -X POST "$APP/api/engage/comment" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"author\":\"Network\",\"postText\":\"Great insights on $TOPIC\",\"link\":\"https://linkedin.com\",\"topic\":\"$TOPIC\"}" || true
          done
          echo "✅ LinkedIn comments drafted"

  news-radar-autopost:
    runs-on: ubuntu-latest
    steps:
      - name: Scan News + Auto-Generate
        run: |
          echo "📰 Scanning news feeds..."
          curl -s -X POST "${{ secrets.APP_URL }}/api/news/scan" \
            -H "Authorization: Bearer ${{ secrets.NEXUS_API_TOKEN }}" \
            -H "Content-Type: application/json"
          echo ""
          echo "✅ News scan complete"
