name: LinkedIn Engagement + News Radar Auto-Post

on:
  schedule:
    - cron: '0 */2 * * *'   # Every 2 hours
  workflow_dispatch:

jobs:
  linkedin-engage:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-Find LinkedIn Posts + Draft Comments
        run: |
          APP="${{ secrets.APP_URL }}"
          TOKEN="${{ secrets.NEXUS_API_TOKEN }}"
          
          # Find relevant posts across topics
          for TOPIC in "AI" "Leadership" "HR" "Business Analytics" "MBA" "Productivity"; do
            echo "🔍 Finding posts about: $TOPIC"
            CANDIDATES=$(curl -s "$APP/api/engage/find?topic=$TOPIC" -H "Authorization: Bearer $TOKEN")
            echo "$CANDIDATES" | jq -r '.candidates[:2][] | @base64' | while read -r cand; do
              DATA=$(echo "$cand" | base64 -d)
              AUTHOR=$(echo "$DATA" | jq -r '.author')
              TEXT=$(echo "$DATA" | jq -r '.text')
              LINK=$(echo "$DATA" | jq -r '.link')
              echo "  Drafting comment for: $AUTHOR"
              curl -s -X POST "$APP/api/engage/comment" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"author\":\"$AUTHOR\",\"postText\":$(echo "$TEXT" | jq -Rs .),\"link\":\"$LINK\",\"topic\":\"$TOPIC\"}" | jq -r '.comment.id' || true
            done
          done
          echo "✅ LinkedIn comments drafted — approve in Discord"

  news-radar-autopost:
    runs-on: ubuntu-latest
    steps:
      - name: Scan News Feeds
        run: |
          curl -s -X POST "${{ secrets.APP_URL }}/api/news/scan" \
            -H "Authorization: Bearer ${{ secrets.NEXUS_API_TOKEN }}" \
            -H "Content-Type: application/json" | jq .
        id: scan

      - name: Auto-Generate Social from Top News
        run: |
          APP="${{ secrets.APP_URL }}"
          TOKEN="${{ secrets.NEXUS_API_TOKEN }}"
          
          # Get pending news opportunities
          NEWS=$(curl -s "$APP/api/news" -H "Authorization: Bearer $TOKEN")
          echo "$NEWS" | jq -r '.items[] | select(.status == "Pending") | @base64' | head -3 | while read -r item; do
            DATA=$(echo "$item" | base64 -d)
            ID=$(echo "$DATA" | jq -r '.id')
            HEADLINE=$(echo "$DATA" | jq -r '.headline')
            SCORE=$(echo "$DATA" | jq -r '.score.overall')
            echo "📰 Generating social for: $HEADLINE (score: $SCORE)"
            curl -s -X POST "$APP/api/news/action" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"id\":\"$ID\",\"action\":\"generate_social\"}" | jq -r '.socialJob.id' || true
          done

      - name: Auto-Generate Blog from Top News
        run: |
          APP="${{ secrets.APP_URL }}"
          TOKEN="${{ secrets.NEXUS_API_TOKEN }}"
          
          # Get pending news and generate blogs for highest scored
          NEWS=$(curl -s "$APP/api/news" -H "Authorization: Bearer $TOKEN")
          echo "$NEWS" | jq -r '.items[] | select(.status == "Pending") | @base64' | head -1 | while read -r item; do
            DATA=$(echo "$item" | base64 -d)
            ID=$(echo "$DATA" | jq -r '.id')
            HEADLINE=$(echo "$DATA" | jq -r '.headline')
            echo "📝 Generating blog for: $HEADLINE"
            curl -s -X POST "$APP/api/news/action" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"id\":\"$ID\",\"action\":\"generate_blog\"}" | jq -r '.blogJob.id' || true
          done
          echo "✅ News radar auto-post complete"
