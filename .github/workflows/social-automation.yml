name: Social Automation — 5x Daily

on:
  schedule:
    - cron: '55 6 * * *'   # 6:55 AM → post at 7:00 AM
    - cron: '55 9 * * *'   # 9:55 AM → post at 10:00 AM
    - cron: '55 12 * * *'  # 12:55 PM → post at 1:00 PM
    - cron: '55 15 * * *'  # 3:55 PM → post at 4:00 PM
    - cron: '55 18 * * *'  # 6:55 PM → post at 7:00 PM

jobs:
  generate-social:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-Generate Social Post
        run: |
          RESP=$(curl -s -X POST "${{ secrets.APP_URL }}/api/social/generate" \
            -H "Authorization: Bearer ${{ secrets.NEXUS_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"platforms":["linkedin","instagram","facebook","threads"]}')
          echo "$RESP"
          if echo "$RESP" | grep -q '"id"'; then
            echo "✅ Social post generated"
          else
            echo "❌ Generation failed"
            exit 1
          fi

      - name: Notify Discord
        if: success()
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"📱 New social post generated — approve in Discord to auto-publish\"}" || true
