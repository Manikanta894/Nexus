name: Social Automation 24/7

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 min — pipeline only fires at the 5 scheduled slots (5 posts/day)
  workflow_dispatch:

jobs:
  generate-social:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Social Pipeline (respects schedule — 5 posts/day)
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/api/pipeline/run" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.NEXUS_API_TOKEN }}" \
            -d '{"module":"social","respectSchedule":true,"source":"autopilot"}' \
            -w "\nHTTP %{http_code}\n"