name: Social Automation 24/7

on:
  schedule:
    - cron: '0 9 * * *'   # 9 AM daily
    - cron: '0 17 * * *'  # 5 PM daily
  workflow_dispatch:

jobs:
  generate-social:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-generate social post
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/api/social/generate" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.NEXUS_API_TOKEN }}" \
            -d '{"platforms":["linkedin","instagram","facebook","threads"]}' \
            -w "\nHTTP %{http_code}\n"