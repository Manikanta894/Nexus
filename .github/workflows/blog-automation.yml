name: Blog Automation 24/7

on:
  schedule:
    - cron: '0 10 * * 1,3,5'  # Mon/Wed/Fri 10 AM
  workflow_dispatch:

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-generate blog + newsletter
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/api/blog/generate" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.NEXUS_API_TOKEN }}" \
            -d '{"seedText":"AI in business"}' \
            -w "\nHTTP %{http_code}\n"