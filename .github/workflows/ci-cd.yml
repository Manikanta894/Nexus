name: CI/CD — Build, Test, Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: API smoke test
        run: |
          echo "MONGO_URL=${{ secrets.MONGO_URL }}" >> .env.local
          echo "APP_SECRET=${{ secrets.APP_SECRET }}" >> .env.local
          echo "DB_NAME=nexus_test" >> .env.local
          node node_modules/next/dist/bin/next start -p 3000 &
          sleep 8
          curl -sf http://localhost:3000/api/root || exit 1
          echo "SMOKE OK"
