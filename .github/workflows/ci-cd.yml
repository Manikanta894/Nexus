name: CI/CD — Build, Test, Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci || npm install
      - run: npm run build
      - name: Verify build
        run: |
          if [ -d ".next" ]; then
            echo "✅ Build successful"
            ls -la .next/
          else
            echo "❌ Build failed"
            exit 1
          fi
