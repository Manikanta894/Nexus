name: Scheduler 24/7

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Publish scheduled posts + scan news
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/api/cron" \
            -H "Content-Type: application/json" \
            -H "x-cron-token: ${{ secrets.NEXUS_CRON_TOKEN }}" \
            -w "\nHTTP %{http_code}\n"